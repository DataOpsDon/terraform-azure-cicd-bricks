name: Release

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Skip if HEAD is already tagged
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # Bump semver: merges to main produce a full release (vX.Y.Z),
      # merges to develop produce a pre-release (vX.Y.Z-rc.N).
      # Override the bump with #major / #minor / #patch in the merge commit message; defaults to patch.
      - name: Compute next version
        id: version
        if: steps.check.outputs.already_tagged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          MSG=$(git log -1 --format=%B)
          BUMP=patch
          if [[ "$MSG" == *"#major"* ]]; then BUMP=major
          elif [[ "$MSG" == *"#minor"* ]]; then BUMP=minor
          elif [[ "$MSG" == *"#patch"* ]]; then BUMP=patch
          fi

          LAST_STABLE=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '-rc\.[0-9]+$' | sort -V | tail -n1 || true)
          LAST_STABLE=${LAST_STABLE:-v0.0.0}

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_STABLE#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT_STABLE="v${MAJOR}.${MINOR}.${PATCH}"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            NEW_TAG="$NEXT_STABLE"
            PRERELEASE=false
          else
            LAST_RC=$(git tag --list "${NEXT_STABLE}-rc.*" | sort -V | tail -n1)
            if [[ -z "$LAST_RC" ]]; then
              RC=1
            else
              RC=$(( ${LAST_RC##*.} + 1 ))
            fi
            NEW_TAG="${NEXT_STABLE}-rc.${RC}"
            PRERELEASE=true
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check.outputs.already_tagged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.already_tagged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=(--generate-notes)
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.new_tag }}" "${FLAGS[@]}"
